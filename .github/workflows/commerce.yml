name: Herb-All validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: herb_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: herb_all_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://herb_test:isolated_ci_only@localhost:5432/herb_all_test
      APP_ENV: development
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:commerce
      - run: npx playwright install --with-deps chromium
      - run: npm run test:commerce:browser
      - run: npm run test:browser
